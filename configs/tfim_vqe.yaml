experiment:
  type: sweep
  name: tfim_vqe_benchmark

system:
  name: tfim
  parameters:
    num_qubits: 2
    J: 1.0
    h: 0.5
  sweep:
    parameter: h
    values: [0.1, 0.5, 1.0, 1.5, 2.0]

algorithm:
  name: vqe

ansatz:
  name: hardware_efficient
  parameters:
    reps: 1

optimizer:
  name: scipy
  parameters:
    method: COBYLA
    maxiter: 200
    num_starts: 10

backend:
  name: statevector
  parameters:
    seed: null

hardware:
  provider: ibm_runtime
  enabled: false
  backend_name: null
  hardware_csv_path: null
  resilience_level: 1
  optimization_level: 3

analysis:
  observables: tfim_default
  fidelity: true

output:
  directory: atlas/data
  csv: true
  plots: true
