experiment:
  type: single_point
  name: tfim_hamiltonian_sim_single

system:
  name: tfim
  parameters:
    num_qubits: 10
    J: 1.0
    h: 0.5
    evolution_time: 0.5

algorithm:
  name: hamiltonian_sim
  parameters:
    evolution_method: strang
    num_trotter_steps: 20

initial_state:
  name: computational
  parameters:
    bitstring: "0000010010"

backend:
  name: statevector_evolver

hardware:
  provider: ibm_runtime
  enabled: false
  backend_name: null
  hardware_csv_path: null
  resilience_level: 1
  optimization_level: 3

analysis:
  observables: tfim_default
  fidelity: true

output:
  directory: atlas/data
  csv: false
  plots: true
