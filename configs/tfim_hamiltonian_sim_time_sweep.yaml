experiment:
  type: sweep
  name: tfim_hamiltonian_sim_time_sweep

system:
  name: tfim
  parameters:
    num_qubits: 2
    J: 1.0
    h: 0.5
  sweep:
    parameter: evolution_time
    values: [0.1, 0.25, 0.5, 1.0]

algorithm:
  name: hamiltonian_sim
  parameters:
    evolution_method: strang
    num_trotter_steps: 8

initial_state:
  name: computational
  parameters:
    bitstring: "00"

backend:
  name: statevector_evolver

hardware:
  provider: ibm_runtime
  enabled: false
  backend_name: null
  hardware_csv_path: null
  resilience_level: 1
  optimization_level: 3

analysis:
  observables: tfim_default
  fidelity: true

output:
  directory: atlas/data
  csv: true
  plots: true
