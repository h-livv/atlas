experiment:
  type: sweep
  name: tfim_hamiltonian_sim_h_sweep

system:
  name: tfim
  parameters:
    num_qubits: 4
    J: 1.0
    h: 0.5
    evolution_time: 0.5
  sweep:
    parameter: h
    values: [0.1, 0.5, 1.0, 1.5, 2.0]

algorithm:
  name: hamiltonian_sim
  parameters:
    evolution_methods: [lie, strang]
    num_trotter_steps: 20

initial_state:
  name: computational
  parameters:
    bitstring: "0011"

backend:
  name: statevector_evolver

hardware:
  provider: ibm_runtime
  enabled: false
  backend_name: null
  hardware_csv_path: null
  resilience_level: 1
  optimization_level: 3

analysis:
  observables: tfim_default
  site_observables: local_z
  fidelity: true

output:
  directory: atlas/data
  csv: true
  plots: true
